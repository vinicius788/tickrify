<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1430"/><stop offset="1" stop-color="#0A0E27"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#0A0E27"/>

  <!-- top label -->
  <text x="540" y="120" text-anchor="middle" fill="#B4BCD0" font-size="40">Subi o print. 30 segundos depois:</text>

  <!-- app header bar -->
  <rect x="60" y="170" width="960" height="110" rx="22" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <circle cx="120" cy="225" r="22" fill="#00FF88"/>
  <text x="120" y="238" text-anchor="middle" fill="#0A0E27" font-size="28" font-weight="900">T</text>
  <text x="165" y="216" fill="#FFFFFF" font-size="38" font-weight="800">TICKRIFY</text>
  <text x="165" y="252" fill="#6b7494" font-size="24">Análise por IA · concluída em 28s</text>
  <rect x="770" y="200" width="210" height="50" rx="25" fill="rgba(0,255,136,0.12)"/>
  <text x="875" y="234" text-anchor="middle" fill="#00FF88" font-size="26" font-weight="700">● BTC/USD · 4H</text>

  <!-- main card -->
  <rect x="60" y="310" width="960" height="1230" rx="28" fill="url(#g)" stroke="#242a3d" stroke-width="2"/>

  <!-- row: estrutura / vies -->
  <text x="100" y="390" fill="#6b7494" font-size="28">ESTRUTURA (Wyckoff)</text>
  <text x="100" y="442" fill="#FFFFFF" font-size="42" font-weight="700">Acumulação · Fase C</text>
  <text x="640" y="390" fill="#6b7494" font-size="28">VIÉS</text>
  <text x="640" y="442" fill="#00FF88" font-size="38" font-weight="800">Comprador · cautela</text>
  <line x1="100" y1="480" x2="980" y2="480" stroke="#1b2342" stroke-width="2"/>

  <!-- entrada / stop -->
  <rect x="100" y="510" width="410" height="160" rx="20" fill="rgba(0,255,136,0.08)" stroke="#00FF88" stroke-width="2"/>
  <text x="130" y="565" fill="#6b7494" font-size="28">ENTRADA</text>
  <text x="130" y="630" fill="#00FF88" font-size="58" font-weight="800">62.450</text>
  <rect x="530" y="510" width="410" height="160" rx="20" fill="rgba(255,59,48,0.08)" stroke="#FF3B30" stroke-width="2"/>
  <text x="560" y="565" fill="#6b7494" font-size="28">STOP</text>
  <text x="560" y="630" fill="#FF3B30" font-size="58" font-weight="800">60.900</text>

  <!-- alvos -->
  <rect x="100" y="700" width="410" height="160" rx="20" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <text x="130" y="755" fill="#6b7494" font-size="28">ALVO 1</text>
  <text x="130" y="820" fill="#FFFFFF" font-size="58" font-weight="800">64.800</text>
  <rect x="530" y="700" width="410" height="160" rx="20" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <text x="560" y="755" fill="#6b7494" font-size="28">ALVO 2</text>
  <text x="560" y="820" fill="#FFFFFF" font-size="58" font-weight="800">66.300</text>

  <!-- R/R + risco + confiança -->
  <rect x="100" y="890" width="840" height="150" rx="20" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <text x="160" y="945" fill="#6b7494" font-size="26">RISCO/RETORNO</text>
  <text x="160" y="1005" fill="#00FF88" font-size="50" font-weight="800">1 : 2,4</text>
  <line x1="400" y1="910" x2="400" y2="1020" stroke="#1b2342" stroke-width="2"/>
  <text x="440" y="945" fill="#6b7494" font-size="26">RISCO NA OP.</text>
  <text x="440" y="1005" fill="#FFB800" font-size="50" font-weight="800">2,4%</text>
  <line x1="680" y1="910" x2="680" y2="1020" stroke="#1b2342" stroke-width="2"/>
  <text x="720" y="945" fill="#6b7494" font-size="26">CONFIANÇA</text>
  <text x="720" y="1005" fill="#FFFFFF" font-size="50" font-weight="800">61%</text>

  <!-- contextual data panel -->
  <text x="100" y="1110" fill="#6b7494" font-size="28">DADOS QUE O PROFISSIONAL OLHA</text>
  <rect x="100" y="1135" width="260" height="120" rx="18" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <text x="230" y="1185" text-anchor="middle" fill="#6b7494" font-size="26">Funding</text>
  <text x="230" y="1230" text-anchor="middle" fill="#00FF88" font-size="40" font-weight="700">+0,011%</text>
  <rect x="390" y="1135" width="290" height="120" rx="18" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <text x="535" y="1185" text-anchor="middle" fill="#6b7494" font-size="26">Long/Short</text>
  <text x="535" y="1230" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="700">1,8</text>
  <rect x="710" y="1135" width="230" height="120" rx="18" fill="#0E1430" stroke="#242a3d" stroke-width="2"/>
  <text x="825" y="1185" text-anchor="middle" fill="#6b7494" font-size="26">Fear &amp; Greed</text>
  <text x="825" y="1230" text-anchor="middle" fill="#FFB800" font-size="40" font-weight="700">38 · Medo</text>

  <!-- HOLD honesty note -->
  <rect x="100" y="1300" width="840" height="180" rx="20" fill="rgba(59,130,246,0.08)" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="1360" fill="#3B82F6" font-size="30" font-weight="800">E quando NÃO há trade?</text>
  <text x="130" y="1410" fill="#B4BCD0" font-size="32">A IA retorna HOLD. Ela não inventa setup pra te</text>
  <text x="130" y="1452" fill="#B4BCD0" font-size="32">agradar. A decisão final é sempre sua.</text>

  <!-- illustrative tag -->
  <text x="540" y="1600" text-anchor="middle" fill="#6b7494" font-size="28">Exemplo ilustrativo da interface — valores demonstrativos.</text>
  <text x="540" y="1860" text-anchor="middle" fill="#4a5270" font-size="24">Conteúdo educacional · Trading envolve risco de perda · Não é recomendação.</text>
</svg>
