      <stop offset="0" stop-color="#0F1838"/><stop offset="1" stop-color="#0A0E27"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- logo -->
  <circle cx="540" cy="520" r="78" fill="#00FF88"/>
  <text x="540" y="552" text-anchor="middle" fill="#0A0E27" font-size="92" font-weight="900">T</text>
  <text x="540" y="700" text-anchor="middle" fill="#FFFFFF" font-size="76" font-weight="800" letter-spacing="4">TICKRIFY</text>
  <text x="540" y="752" text-anchor="middle" fill="#6b7494" font-size="30">A IA que lê seu gráfico</text>

