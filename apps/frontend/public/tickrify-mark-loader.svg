<svg xmlns="http://www.w3.org/2000/svg" viewBox="298.4 70.4 250.4 301.6" width="250" height="301" role="img" aria-label="Tickrify">
<!-- Logo animada de carregamento. Mesmo vetor do tickrify-lockup.svg, so o icone.
     A camada fraca (.14) fica sempre visivel: se a animacao nao rodar (aba em
     segundo plano, webview restrito), aparece a logo apagada, nunca tela preta.
     Usada no index.html (antes do React) e no BrandLoader (depois), entao a
     animacao mora AQUI, num arquivo so. Ver CLAUDE.md, 24/09/2026. -->
<style>
.p{transform-box:fill-box;animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.roof{transform-origin:50% 100%;animation-name:roof}
.blue{transform-origin:50% 100%;animation-name:blue}
.green{transform-origin:50% 100%;animation-name:green}
.check{transform-origin:0% 60%;animation-name:check}
@keyframes roof{0%{opacity:0;transform:translateY(-22%)}16%,86%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes blue{0%,12%{opacity:0;transform:scaleY(0)}32%,86%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes green{0%,22%{opacity:0;transform:scaleY(0)}42%,86%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes check{0%,40%{opacity:0;clip-path:inset(0 100% 0 0);transform:scale(.9)}58%{opacity:1;clip-path:inset(0 0 0 0);transform:scale(1.06)}66%,86%{opacity:1;clip-path:inset(0 0 0 0);transform:none}100%{opacity:0;clip-path:inset(0 0 0 0);transform:none}}
@media (prefers-reduced-motion:reduce){.p{animation:none}svg{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
</style>
