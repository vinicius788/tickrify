    <!-- Uma unica requisicao de fonte, e ela NAO bloqueia a primeira pintura.
         Medido no PageSpeed em 21/09/2026: este <link> respondia sozinho por
         750ms dos 1.050ms de bloqueio de renderizacao no mobile, para baixar
         2,2 KB de CSS. media="print" faz o navegador baixar fora do caminho
         critico; o onload devolve para "all" quando o arquivo chega. O
         <noscript> cobre quem nao executa JS. Todas as familias ja usam
         display=swap, entao o texto sempre pinta antes da fonte chegar, com
         ou sem isto. Se alguem tirar o media/onload daqui, o FCP do mobile
         volta a piorar ~0,75s e nada quebra visivelmente: confira no
         PageSpeed, nao no olho.
         Syne saiu em 21/09/2026: zero ocorrencia no projeto inteiro fora
         desta propria URL. A API css2 aceita varias familias na mesma URL,
         em ordem alfabetica. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Geist:wght@300;400;500;600;700;800;900&amp;family=Geist+Mono:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    >
    <noscript>

    <style>
/* Casca pré-hidratação: só a barra do cabeçalho, sem texto.
         Nas mesmas medidas da barra real. Ver CLAUDE.md, 25/08/2026. */
      html, body { background: #08090a; margin: 0; }
      .ph-bar {
        height: 68px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
      }
      .ph-bar > span {
        display: block;
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 clamp(20px, 5vw, 64px);
      }
      .ph-bar img { display: block; height: 30px; width: auto; }
      .ph-load { display: none; }
      .tk-boot .ph-bar { display: none; }
      .tk-boot .ph-load { display: flex; position: fixed; inset: 0; align-items: center; justify-content: center; }
      .ph-load img { width: 64px; height: 77px; }

      /* Corpo pre-renderizado (scripts/geo-body.mjs). So aparece sem JS.
         Existe para o crawler, mas se uma pessoa cair aqui tem que dar pra ler:
         o fundo do site e escuro e o texto padrao sairia preto. */
      noscript main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px clamp(20px, 5vw, 64px) 80px;
        color: #e6e8ea;
        font: 400 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;

      noscript a { color: #5eea8a; }
      noscript table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
      noscript th, noscript td {
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 8px 10px;
        text-align: left;
      }
      noscript dt { font-weight: 600; margin-top: 1.1em; }
      noscript dd { margin: 0.35em 0 0; }
