<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon.png?v=3" />
    <link rel="shortcut icon" href="/icon.png?v=3" />
    <link rel="apple-touch-icon" href="/icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickrify: AI chart analysis for traders</title>
    <meta name="description" content="Paste your chart and AI reads the entry, stop, targets and risk. A second opinion that confirms or kills your read. 3 free analyses, no card needed." />
    <meta name="author" content="Tickrify" />
    <link rel="canonical" href="https://tickrify.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Uma unica requisicao de fonte. Eram tres <link> separados = tres
         idas ao fonts.googleapis.com bloqueando a primeira pintura. A API
         css2 aceita varias familias na mesma URL, em ordem alfabetica. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Geist:wght@300;400;500;600;700;800;900&amp;family=Geist+Mono:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Syne:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    >
    
    <meta property="og:title" content="Tickrify: AI chart analysis for traders" />
    <meta property="og:description" content="Paste your chart and AI reads the entry, stop, targets and risk. A second opinion that confirms or kills your read. 3 free analyses, no card needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tickrify.com/" />
    <meta property="og:image" content="https://tickrify.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tickrify: stop trading in the dark. AI reads the entry, stop, targets and risk."/>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tickrify: AI chart analysis for traders" />
    <meta name="twitter:description" content="Paste your chart and AI reads the entry, stop, targets and risk. A second opinion that confirms or kills your read. 3 free analyses, no card needed." />
    <meta name="twitter:image" content="https://tickrify.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tickrify.com/#organization",
            "name": "Tickrify",
            "url": "https://tickrify.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://tickrify.com/logo.png"
            },
            "sameAs": [
              "https://x.com/tickrify",
              "https://instagram.com/tickrify"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://tickrify.com/#website",
            "name": "Tickrify",
            "url": "https://tickrify.com",
            "description": "Paste your chart and AI reads the entry, stop, targets and risk. A second opinion that confirms or kills your read. The final call is yours.",
            "publisher": { "@id": "https://tickrify.com/#organization" }
          }
        ]
      }
    </script>

    <style>
      /* PINTURA PRÉ-HIDRATAÇÃO
       *
       * Isto é o que a pessoa vê enquanto o bundle carrega, e ele é servido
       * para TODA rota (o Vercel devolve este HTML para /pricing, /terms,
       * /dashboard e o que mais não for arquivo estático).
       *
       * Por isso ele não tem texto nenhum. Até 25/08/2026 ele trazia o hero
       * antigo da landing embutido, em Fraunces 6.5rem e verde #5eea8a: quem
       * abria o site via um lampejo do desenho ANTIGO e depois o novo, e quem
       * abria /terms via "Stop trading in the dark" antes dos termos. Texto
       * aqui é sempre texto que pode estar errado em algum lugar.
       *
       * O que ficou é só a barra do cabeçalho, nas MESMAS medidas da barra de
       * verdade (68px de altura, mesma hairline, mesma caixa de 1240px). Assim
       * o React monta por cima sem nada saltar de lugar.
       */
      html, body { background: #08090a; margin: 0; }
      .ph-bar {
        height: 68px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
      }
      .ph-bar > span {
        display: block;
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 clamp(20px, 5vw, 64px);
      }
      .ph-bar img { display: block; height: 30px; width: auto; }
    </style>
  </head>
  <body>
    <div id="root"><div class="ph-bar"><span><img src="/tickrify-lockup.svg" alt="Tickrify" width="116" height="30" /></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
