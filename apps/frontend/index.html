<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon.png?v=3" />
    <link rel="shortcut icon" href="/icon.png?v=3" />
    <link rel="apple-touch-icon" href="/icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Tickrify" />
    <link rel="canonical" href="https://tickrify.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Uma unica requisicao de fonte. Eram tres <link> separados = tres
         idas ao fonts.googleapis.com bloqueando a primeira pintura. A API
         css2 aceita varias familias na mesma URL, em ordem alfabetica. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Geist:wght@300;400;500;600;700;800;900&amp;family=Geist+Mono:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Syne:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    >
    
    <meta property="og:title" content="AI Chart Analysis for Forex, Gold &amp; Crypto | Tickrify" />
    <meta property="og:description" content="Upload a trading chart and get a structured AI read: entry, stop, targets, risk and an explicit WAIT. Try 3 analyses free, no card required." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tickrify.com/" />
    <meta property="og:image" content="https://tickrify.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tickrify: stop trading in the dark. AI reads the entry, stop, targets and risk."/>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Chart Analysis for Forex, Gold &amp; Crypto | Tickrify" />
    <meta name="twitter:description" content="Upload a trading chart and get a structured AI read: entry, stop, targets, risk and an explicit WAIT. Try 3 analyses free, no card required." />
    <meta name="twitter:image" content="https://tickrify.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tickrify.com/#organization",
            "name": "Tickrify",
            "url": "https://tickrify.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://tickrify.com/logo.png"
            },
            "sameAs": [
              "https://x.com/tickrify",
              "https://instagram.com/tickrify"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://tickrify.com/#website",
            "name": "Tickrify",
            "url": "https://tickrify.com",
            "description": "Upload a trading chart and get a structured AI read: entry, stop, targets, risk and an explicit WAIT. Try 3 analyses free, no card required.",
            "publisher": { "@id": "https://tickrify.com/#organization" }
          }
        ]
      }
    </script>

    <style>
/* Casca pré-hidratação: só a barra do cabeçalho, sem texto.
         Nas mesmas medidas da barra real. Ver CLAUDE.md, 25/08/2026. */
      html, body { background: #08090a; margin: 0; }
      .ph-bar {
        height: 68px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
      }
      .ph-bar > span {
        display: block;
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 clamp(20px, 5vw, 64px);
      }
      .ph-bar img { display: block; height: 30px; width: auto; }

      /* Corpo pre-renderizado (scripts/geo-body.mjs). So aparece sem JS.
         Existe para o crawler, mas se uma pessoa cair aqui tem que dar pra ler:
         o fundo do site e escuro e o texto padrao sairia preto. */
      noscript main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px clamp(20px, 5vw, 64px) 80px;
        color: #e6e8ea;
        font: 400 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      noscript h1 { font-size: 1.9rem; line-height: 1.2; }
      noscript h2 { font-size: 1.25rem; margin-top: 2.2em; }
      noscript a { color: #5eea8a; }
      noscript table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
      noscript th, noscript td {
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 8px 10px;
        text-align: left;
      }
      noscript dt { font-weight: 600; margin-top: 1.1em; }
      noscript dd { margin: 0.35em 0 0; }
    </style>
  </head>
  <body>
    <div id="root"><div class="ph-bar"><span><img src="/tickrify-lockup.svg" alt="Tickrify" width="116" height="30" /></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
