name: CI

on:
  pull_request:
  # push so na main: branch com PR ja roda pelo `pull_request`; rodar nos dois
  # gastava o dobro de minuto de Actions (repo privado, cota estourou em 09/2026).
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.12.4"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=tickrify
  MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=tickrify

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high --prod
        continue-on-error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --dir apps/backend exec eslint "{src,apps,libs,test,worker}/**/*.ts"

      - name: Lint frontend
        run: pnpm --dir apps/frontend lint

  # O typecheck NÃO rodava no CI (descoberto em 19/08/2026). Pior: o script
  # `typecheck` do frontend era `tsc --noEmit` num tsconfig com "files": [] e
  # "references" — que não checa NADA e sai 0. Ou seja, existiam duas camadas de
  # typecheck falso empilhadas. Agora roda de verdade, e o `build` depende disto.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O client do Prisma precisa existir antes do tsc: sem ele o backend não
      # compila (`@prisma/client` não tem os tipos dos models).
      - name: Gerar Prisma Client
        run: pnpm --dir apps/backend postinstall

      - name: Typecheck backend
        run: pnpm --dir apps/backend exec tsc --noEmit -p tsconfig.json

      # `tsc -b` (build mode) é o ÚNICO que segue project references.
      - name: Typecheck frontend
        run: pnpm --dir apps/frontend typecheck

  # PENTE FINO (item 10). Nada vai ao ar sem passar por aqui.
  # A parte que precisa de produção no ar (HTTPS, HSTS, cabeçalhos entregues,
  # rotas protegidas respondendo 401 de verdade) roda no auditoria-prod.yml,
  # depois do deploy — porque cabeçalho configurado no código não é cabeçalho
  # entregue ao navegador: Vercel, Render e Cloudflare ficam no meio.
  auditoria:
    name: Auditoria de segurança
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pente fino
        run: pnpm auditoria

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --dir apps/backend exec jest --runInBand

      - name: Run frontend tests
        run: pnpm --dir apps/frontend test

  # Espelha o job do secrets.yml para que o build DEPENDA da varredura de
  # segredos. Sem isto os dois workflows correm em paralelo e um commit com
  # chave vazada seria buildado e publicado antes de alguém ver o vermelho.
  segredos:
    name: Segredos
    uses: ./.github/workflows/secrets.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - segredos
      - auditoria
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --dir apps/backend build

      - name: Build frontend
        run: pnpm --dir apps/frontend build
