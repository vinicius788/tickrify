name: Keep API warm

# Mantém o backend do Render (plano free) acordado, pra a PRIMEIRA análise
# do usuário não pegar o "cold start" lento (~30-60s). Dá um ping no health
# endpoint a cada ~10 minutos.
#
# Observação: o cron do GitHub Actions pode atrasar alguns minutos sob carga;
# ~10 min é folgado pro Render (que hiberna após 15 min de inatividade).

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 minutos
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging API health..."
          curl -fsS --max-time 30 https://tickrify.onrender.com/api/health/live \
            && echo "OK — API respondeu (acordada)." \
            || echo "Ping falhou (provável cold start). O próximo ping reativa."
