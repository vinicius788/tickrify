name: Smoke Test Produção
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Teto: um job travado nao pode comer a cota de 2.000 min/mes (29/09 a 05/10
    # cada CI rodava ate 6h e esgotou outubro).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        env:
          SMOKE_OPS_TOKEN: ${{ secrets.INTERNAL_OPS_TOKEN }}
        run: bash scripts/smoke.sh https://tickrify.onrender.com https://tickrify.com
