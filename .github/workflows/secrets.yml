name: Segredos

# TRAVA DO ITEM 6: nenhuma senha, chave ou token entra no repositório.
#
# Roda em TODO push e TODA pull request, e o job `build` do ci.yml depende
# deste — ou seja, código com segredo não chega a ser buildado.
#
# Duas varreduras diferentes, de propósito:
#   1. histórico → TODAS as refs. Pega segredo que foi commitado e "removido"
#      depois: remover num commit seguinte NÃO apaga do histórico, e qualquer
#      clone do repositório continua entregando o valor.
#   2. --no-git  → os arquivos como estão no disco. Pega arquivo não rastreado
#      que alguém esqueceu de pôr no .gitignore antes de commitar.
#
# ⚠️ SE ESTE JOB FICAR VERMELHO, O SEGREDO JÁ VAZOU.
# Ordem certa das ações:
#   1. ROTACIONE a chave no provedor (OpenAI, Stripe, Clerk, Supabase...) AGORA.
#      Enquanto ela for válida, limpar o histórico não protege nada.
#   2. Só depois limpe o histórico (git-filter-repo) e faça force-push.
#   3. Confirme que o valor novo está só no painel do Render, nunca no código.

on:
  # `workflow_call` = este workflow é CHAMADO pelo job `segredos` do ci.yml.
  # Deliberadamente SEM `push`/`pull_request` próprios: com eles, a varredura
  # rodaria duas vezes por commit (uma sozinha, outra dentro do CI) e gastaria
  # minuto de Actions à toa. Quem dispara é o ci.yml, que já roda em push e PR
  # — e é lá que o `build` depende do resultado.
  workflow_call: {}
  workflow_dispatch: {}

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    # Teto: um job travado nao pode comer a cota de 2.000 min/mes (29/09 a 05/10
    # cada CI rodava ate 6h e esgotou outubro).
    timeout-minutes: 10
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 0 = histórico inteiro. Sem isto a varredura de histórico vira teatro.

      # Binário oficial em vez da gitleaks-action: a action v2 exige chave de
      # licença quando o repositório pertence a uma organização, e descobrir isso
      # no dia em que o repo virar org é o pior momento possível.
      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varrer o histórico inteiro
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks-historico.sarif \
            --log-opts="--all" \
            --verbose

      - name: Varrer os arquivos como estão no disco
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --verbose

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gitleaks
          path: gitleaks-historico.sarif
          if-no-files-found: ignore
          retention-days: 30

  arquivos-de-ambiente:
    name: Nenhum .env rastreado
    runs-on: ubuntu-latest
    # Teto: um job travado nao pode comer a cota de 2.000 min/mes (29/09 a 05/10
    # cada CI rodava ate 6h e esgotou outubro).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Complemento barato ao gitleaks: um .env pode ser commitado com valores
      # que nenhum detector reconhece (senha curta, chave de serviço interno).
      # A regra aqui não é sobre o conteúdo — é que .env NUNCA é rastreado.
      - name: Conferir
        run: |
          set -euo pipefail
          RASTREADOS=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)
          if [ -n "$RASTREADOS" ]; then
            echo "::error::Arquivo de ambiente rastreado pelo git:"
            echo "$RASTREADOS"
            echo ""
            echo "Corrija com: git rm --cached <arquivo> e confirme que ele está no .gitignore."
            echo "Se ele JÁ FOI COMMITADO antes, rotacione as chaves ANTES de limpar o histórico."
            exit 1
          fi
          echo "OK: nenhum arquivo de ambiente rastreado."
