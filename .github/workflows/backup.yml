name: Backup diário do banco (Supabase)

# Backup automático e GRATUITO do Postgres do Supabase (plano free não tem backup).
# - Roda todo dia às 07:00 UTC (04:00 Brasília) + botão manual (workflow_dispatch).
# - Usa o SESSION POOLER (IPv4) — o host direto do Supabase é IPv6-only e o
#   GitHub Actions não alcança (mesma lição da MIGRATIONS_DATABASE_URL).
# - O dump vai como ARTIFACT privado do repo, com retenção de 30 dias
#   (rotação automática, sem segundo repositório, sem token extra).
# - Segredo necessário (criar em Settings → Secrets and variables → Actions):
#     SUPABASE_DB_URL = a MESMA string da MIGRATIONS_DATABASE_URL do Render
#     (postgresql://postgres.<ref>:<senha>@aws-0-us-west-2.pooler.supabase.com:5432/postgres)
# - Restaurar: baixar o artifact e rodar
#     pg_restore -d "<url-do-banco>" --clean --if-exists tickrify-AAAA-MM-DD.dump

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cliente PostgreSQL 17 (compatível com o Supabase)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump do banco
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL não configurado (Settings → Secrets → Actions)."
            exit 1
          fi
          STAMP=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --no-owner --no-privileges --format=custom \
            --file="tickrify-${STAMP}.dump"
          ls -lh tickrify-*.dump

      - name: Guardar backup (artifact privado, 30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: tickrify-*.dump
          retention-days: 30
          if-no-files-found: error
